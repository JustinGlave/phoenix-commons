[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-commons"
description = "Shared design system, widgets, auto-updater, and utilities for the Phoenix Controls family of PySide6 desktop tools."
readme = "README.md"
authors = [{ name = "Justin Glave" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-qt>=4.4",
]

[project.urls]
Homepage = "https://github.com/JustinGlave/phoenix-commons"

[tool.setuptools.dynamic]
version = { attr = "phoenix_commons._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Package-data declarations.
# Both wheels and PyInstaller (--collect-data phoenix_commons) pick these
# up via importlib.resources; source-mode (editable installs) reads from
# the working tree directly.
[tool.setuptools.package-data]
"phoenix_commons.theme"        = ["*.qss"]
"phoenix_commons.icons.lucide" = ["*.svg"]
